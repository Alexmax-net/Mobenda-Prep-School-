<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobenda Preparatory School - Records</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#f4f6fa;color:#222}
  header{background:#0b3d91;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:18px}
 .container{max-width:1000px;margin:15px auto;padding:0 12px}
 .card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:18px}
 .btn{background:#0b3d91;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;margin:3px}
 .btn-red{background:#d32f2f}.btn-green{background:#2e7d32}
  input,select{width:100%;padding:10px;margin:6px 0 10px;border:1px solid #ccc;border-radius:8px}
  label{font-weight:bold;font-size:14px}
  nav{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
  nav button{flex:1;min-width:100px;padding:11px;border-radius:8px;border:1px solid #0b3d91;background:white;color:#0b3d91;cursor:pointer;font-weight:bold}
  nav button.active{background:#0b3d91;color:white}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  th,td{border:1px solid #ddd;padding:7px;text-align:left}
  th{background:#0b3d91;color:white}
 .stats{display:flex;gap:10px}
 .stat{flex:1;background:#0b3d91;color:white;padding:15px;border-radius:12px;text-align:center}
  #loginBox{max-width:400px;margin:50px auto}
</style>
</head>
<body>

<header>
  <h1>MOBENDA PREPARATORY SCHOOL</h1>
  <button class="btn btn-red" onclick="logout()">Logout</button>
</header>

<div id="loginBox" class="card">
  <h2>Staff Login</h2>
  <label>Username</label><input id="username" placeholder="admin">
  <label>PIN</label><input id="password" type="password">
  <button class="btn" style="width:100%" onclick="login()">Login</button>
</div>

<div class="container" id="app" style="display:none;">
  <div class="stats">
    <div class="stat"><h3 id="studentCount">0</h3><p>Students</p></div>
    <div class="stat"><h3 id="staffCount">0</h3><p>Staff</p></div>
  </div>

  <nav>
    <button class="active" onclick="showTab('students')">Students</button>
    <button onclick="showTab('staff')">Staff</button>
    <button onclick="showTab('settings')">Accounts</button>
  </nav>

  <div id="tab-students" class="card">
    <h3>Add New Student</h3>
    <input id="sName" placeholder="Student Full Name">
    <input id="sClass" placeholder="Class (e.g. JHS 3)">
    <input id="sGuardian" placeholder="Guardian Name">
    <input id="sPhone" placeholder="Guardian Phone">
    <button class="btn btn-green" onclick="addStudent()">Save Student</button>
    <table><tr><th>Name</th><th>Class</th><th>Guardian</th><th>Phone</th></tr><tbody id="studentTable"></tbody></table>
  </div>

  <div id="tab-staff" class="card" style="display:none;">
    <h3>Add New Staff</h3>
    <input id="tName" placeholder="Staff Full Name">
    <input id="tRole" placeholder="Role">
    <input id="tPhone" placeholder="Phone">
    <button class="btn btn-green" onclick="addStaff()">Save Staff</button>
    <table><tr><th>Name</th><th>Role</th><th>Phone</th></tr><tbody id="staffTable"></tbody></table>
  </div>

  <div id="tab-settings" class="card" style="display:none;">
    <h3>Add Staff Login</h3>
    <input id="newUser" placeholder="Username">
    <input id="newPass" placeholder="PIN">
    <button class="btn" onclick="addUser()">Add Account</button>
  </div>
</div>

<script>
const API_URL = "PASTE_YOUR_WEB_APP_URL_HERE";
let students = [], staffs = [], users = [];

async function loadAll() {
  students = await (await fetch(API_URL + "?sheet=Students")).json();
  staffs = await (await fetch(API_URL + "?sheet=Staff")).json();
  users = await (await fetch(API_URL + "?sheet=Users")).json();
  updateUI();
}

function updateUI() {
  document.getElementById('studentCount').innerText = students.length;
  document.getElementById('staffCount').innerText = staffs.length;
  document.getElementById('studentTable').innerHTML = students.map(s => `<tr><td>${s.Name}</td><td>${s.Class}</td><td>${s.Guardian}</td><td>${s.Phone}</td></tr>`).join('');
  document.getElementById('staffTable').innerHTML = staffs.map(s => `<tr><td>${s.Name}</td><td>${s.Role}</td><td>${s.Phone}</td></tr>`).join('');
}

async function login() {
  await loadAll();
  let u = document.getElementById('username').value.trim();
  let p = document.getElementById('password').value.trim();
  if (users.find(x => x.Username === u && String(x.PIN) === p)) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    alert('Wrong username or PIN');
  }
}
function logout(){ location.reload(); }

function showTab(t){
  document.querySelectorAll('[id^="tab-"]').forEach(d=>d.style.display='none');
  document.getElementById('tab-'+t).style.display='block';
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}

async function addStudent(){
  let name = document.getElementById('sName').value;
  if(!name) return alert('Enter student name');
  let row = [name, document.getElementById('sClass').value, document.getElementById('sGuardian').value, document.getElementById('sPhone').value];
  await fetch(API_URL + "?sheet=Students", {method:"POST", body: JSON.stringify(row)});
  alert('Student saved and synced'); loadAll();
}

async function addStaff(){
  let name = document.getElementById('tName').value;
  if(!name) return alert('Enter staff name');
  let row = [name, document.getElementById('tRole').value, document.getElementById('tPhone').value];
  await fetch(API_URL + "?sheet=Staff", {method:"POST", body: JSON.stringify(row)});
  alert('Staff saved and synced'); loadAll();
}

async function addUser(){
  let u = document.getElementById('newUser').value.trim();
  let p = document.getElementById('newPass').value.trim();
  if(!u ||!p) return alert('Fill both fields');
  let row = [u, p];
  await fetch(API_URL + "?sheet=Users", {method:"POST", body: JSON.stringify(row)});
  alert('Account created for ' + u);
}
</script>
</body>
</html>
